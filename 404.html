<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0c'/%3E%3Ctext x='16' y='21.5' font-family='Arial' font-weight='700' font-size='14.5' text-anchor='middle' fill='white'%3ESK%3C/text%3E%3C/svg%3E">
<title>Page not found — Samuel Kalongo</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f9fb;color:#0b0b0c;font:400 16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;padding:32px}
  p.k{font:500 12.5px ui-monospace,Menlo,Consolas,monospace;color:#6b7280;text-transform:uppercase;letter-spacing:.09em;margin:0 0 16px}
  h1{font-size:44px;line-height:1.05;letter-spacing:-.035em;margin:0 0 16px}
  p{color:#6b7280;margin:0 0 28px}
  a{display:inline-block;background:#0b0b0c;color:#fff;text-decoration:none;font-size:14px;font-weight:500;padding:10px 20px;border-radius:999px}
</style></head>
<body><main>
<p class="k">404</p>
<h1>That page has moved.</h1>
<p>The portfolio was rebuilt, so some old links no longer exist. Everything is on the home page.</p>
<a id="home" href="/">Go to the portfolio</a>
</main>
<script>
  // Works for a project site (/repo-name/...) and for a root domain.
  (function () {
    var seg = location.pathname.split('/')[1];
    var base = /\.github\.io$/.test(location.hostname) && seg ? '/' + seg + '/' : '/';
    document.getElementById('home').setAttribute('href', base);
  })();
</script>
</body></html>
